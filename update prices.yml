name: Actualizar precios fondos

on:
  schedule:
    - cron: '0 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests curl_cffi
      - name: Obtener precios
        run: python update_prices.py
      - name: Commit y push prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "🤖 Precios $(date +'%Y-%m-%d %H:%M UTC')"
          # si main avanzó durante el run (p.ej. subiste archivos), integrar antes de empujar
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push falló, reintento $i..."
            sleep 5
          done
          echo "No se pudo hacer push tras 3 intentos" && exit 1
